
# ============================================================
# + Spring Boot CRM 공통 환경설정
# 역할: 서버 실행 환경, 데이터베이스 연결 옵션,
#       Google OAuth2 로그인 및 JWT 인증 관련 설정을 관리합니다.
#       민감한 인증 정보는 환경변수를 통해 주입받습니다.
# 작성자: 황현우
# 일시: 2026-11-10
# ============================================================


# ============================================================
# 1. Spring Boot 실행 환경 설정
# ============================================================

# Shared configuration (never commit real credentials)

# 활성 프로필이 별도로 지정되지 않은 경우 dev 프로필 사용
# application-dev.properties 등의 개발 환경 설정을 적용할 수 있음
spring.profiles.default=dev

# Spring Boot 내장 서버 포트 설정
# SERVER_PORT 환경변수에 지정된 포트 번호 사용
server.port=${SERVER_PORT}


# ============================================================
# 2. JPA 및 데이터베이스 설정
# ============================================================

# JPA Open Session In View 기능 비활성화
# 웹 요청 처리 중 영속성 컨텍스트가 View까지 유지되지 않도록 설정
# 불필요한 DB 접근을 줄이고 서비스 계층에서 데이터 조회를 관리
spring.jpa.open-in-view=false

# JDBC encoding applies even when DB_URL has no encoding query parameter.

# HikariCP 데이터베이스 연결 시 문자 인코딩 설정
# 한글 등 UTF-8 문자 데이터 처리를 위한 연결 속성
spring.datasource.hikari.data-source-properties.characterEncoding=UTF-8

# Spring SQL 초기화 기능 비활성화
# schema.sql, data.sql 파일을 이용한 자동 초기화 실행 안 함
spring.sql.init.mode=never


# ============================================================
# 3. Google OAuth2 로그인 설정
# ============================================================

# Google OAuth2 설정

# Google OAuth2 클라이언트 ID
# GOOGLE_CLIENT_ID 환경변수에서 값을 가져옴
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

# Google OAuth2 클라이언트 Secret
# GOOGLE_CLIENT_SECRET 환경변수에서 값을 가져옴
# 실제 Secret 값을 GitHub에 직접 등록하지 않도록 주의
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Google 로그인 시 요청할 사용자 정보 범위
# email : 이메일 주소
# profile : 기본 프로필 정보
spring.security.oauth2.client.registration.google.scope=email,profile


# ============================================================
# 4. JWT 인증 설정
# ============================================================

# JWT 설정

# JWT 서명 및 검증에 사용할 비밀키
# JWT_SECRET 환경변수에서 값을 가져옴
# 실제 비밀키는 소스코드에 직접 작성하지 않음
jwt.secret=${JWT_SECRET}

# JWT 토큰 유효기간 설정
# 단위: 밀리초(ms)
# 86400000ms = 24시간 = 1일
jwt.expiration=86400000

# 고객 주요 정보 제거 배치: DB 마이그레이션 적용 후 명시적으로 활성화한다.
# 작성자: 김순민 / 작성일: 2026-11-11
app.customer.privacy.enabled=${CUSTOMER_PRIVACY_ENABLED:false}
app.customer.privacy.cron=${CUSTOMER_PRIVACY_CRON:0 0 3 * * *}
