<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- 사용: <section th:replace="~{loyalty/_point :: pointPanel}"></section>
     필요한 모델 값: pointBalance, pointHistory -->
<section th:fragment="pointPanel" class="card mb-4" aria-labelledby="point-panel-title">
  <div class="card-header fw-bold" id="point-panel-title">포인트 내역</div>
  <div class="card-body">현재 잔액 <strong th:text="${#numbers.formatInteger(pointBalance != null ? pointBalance : 0, 1, 'COMMA')}">0</strong> P
    <p class="small text-muted mb-0">잔액은 서버의 거래 원장(적립 − 사용)을 기준으로 계산합니다.</p>
  </div>
  <ul class="list-group list-group-flush">
    <li th:each="entry : ${pointHistory}" class="list-group-item d-flex justify-content-between">
      <span th:text="${#temporals.format(entry.createdAt, 'yyyy-MM-dd HH:mm')}">일시</span>
      <span><span th:text="${entry.type.displayName}">적립</span> <span th:text="${#numbers.formatInteger(entry.point, 1, 'COMMA')}">0</span>P</span>
    </li>
    <li th:if="${pointHistory == null or #lists.isEmpty(pointHistory)}" class="list-group-item text-muted">포인트 내역이 없습니다.</li>
  </ul>
</section>
</body>
</html>
