<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

    <title>단골 고객 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

    <link rel="stylesheet" href="/css/modern-saas.css" th:href="@{/css/modern-saas.css}"/>


    <!-- Spring Security CSRF 토큰 -->
    <meta name="_csrf"
          th:if="${_csrf != null}"
          th:content="${_csrf.token}"/>

    <meta name="_csrf_header"
          th:if="${_csrf != null}"
          th:content="${_csrf.headerName}"/>

</head>
<body>
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4"><i class="bi bi-person-plus"></i> 회원가입</h3>
                    <div class="alert alert-danger d-none" id="errorMsg"></div>
                    <div class="alert alert-success d-none" id="successMsg"></div>
                    <form id="signupForm">
                        <div class="mb-3">
                            <label class="form-label" for="email">이메일</label>
                            <input class="form-control" id="email" name="email" placeholder="example@test.com" required="" type="email"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">비밀번호</label>
                            <input class="form-control" id="password" name="password" maxlength="20" minlength="4" placeholder="4~20자" required="" type="password"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="nickname">닉네임</label>
                            <input class="form-control" id="nickname" name="nickname" maxlength="10" minlength="2" placeholder="2~10자" required="" type="text"/>
                        </div>
                        <button class="btn btn-primary w-100 mb-3" type="submit"><i class="bi bi-person-plus"></i> 가입하기</button>
                    </form>
                    <div class="text-center">
                        <span class="text-muted">이미 계정이 있으신가요?</span>
                        <a href="/login" th:href="@{/login}">로그인</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="saas-footer">
    <div class="text-center">
        <p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
        <p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
    </div>
</footer>

<script src="/js/modern-saas.js" th:src="@{/js/modern-saas.js}" defer></script>
<script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const nickname = document.getElementById('nickname').value;

        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        try {
// HTML에 저장된 CSRF 토큰 가져오기
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

// 요청 헤더 준비
            const headers = {
                'Content-Type': 'application/json'
            };

// CSRF 토큰이 있으면 요청 헤더에 추가
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }

// 회원가입 API 호출
            const response = await fetch('/api/members/signup', {
                method: 'POST',
                headers: headers,
                credentials: 'same-origin',
                body: JSON.stringify({ email, password, nickname })
            });

            if (response.ok) {
                successMsg.textContent = '회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.';
                successMsg.classList.remove('d-none');
                errorMsg.classList.add('d-none');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                const data = await response.json().catch(() => ({}));
                errorMsg.textContent = data.message || '회원가입에 실패했습니다.';
                errorMsg.classList.remove('d-none');
                successMsg.classList.add('d-none');
            }
        } catch (err) {
            errorMsg.textContent = '서버 통신 중 오류가 발생했습니다.';
            errorMsg.classList.remove('d-none');
            successMsg.classList.add('d-none');
        }
    });
</script>
</body>
</html>
