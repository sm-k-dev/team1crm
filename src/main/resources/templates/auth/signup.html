<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<title>단골 고객 관리</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

<link rel="stylesheet" href="/css/modern-saas.css" th:href="@{/css/modern-saas.css}"/>
</head>
<body>
<nav aria-label="주 메뉴" class="saas-shell-nav">
<div class="saas-topbar">
<a class="saas-mobile-brand" href="/" th:href="@{/}"><i class="bi bi-grid-1x2-fill"></i> StoreCRM</a>
<button aria-controls="saasSidebar" aria-expanded="false" aria-label="메뉴 열기" class="saas-menu-toggle" type="button"><i class="bi bi-list"></i></button>
<span class="saas-topbar-label">매장 고객 관리 시스템</span>
<div class="saas-topbar-right">
<span class="saas-user"><i class="bi bi-person-circle"></i> <span>사용자</span></span>
<a class="saas-logout" href="/login" th:href="@{/login}"><i class="bi bi-box-arrow-right"></i> 로그아웃</a>
<a class="saas-logout" href="/login" th:href="@{/login}">로그인</a>
</div>
</div>
<aside class="saas-sidebar" id="saasSidebar">
<a class="saas-brand" href="/" th:href="@{/}"><span class="saas-brand-icon"><i class="bi bi-bar-chart-steps"></i></span><span><strong>StoreCRM</strong><small>매장 고객 관리 시스템</small></span></a>

<div class="saas-nav-section">ADMIN</div>
<a class="saas-side-link" data-route="/admin/dashboard" href="/admin/dashboard" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> 사장님/매장 현황</a>
<a class="saas-side-link" data-route="/admin/stores" href="/admin/stores" th:href="@{/admin/stores}"><i class="bi bi-shop"></i> 매장 관리</a>
<a class="saas-side-link" data-route="/admin/owners" href="/admin/owners" th:href="@{/admin/owners}"><i class="bi bi-person-badge"></i> 사장님 계정 관리</a>


<div class="saas-nav-section">WORKSPACE</div>
<a class="saas-side-link" data-route="/" href="/" th:href="@{/}"><i class="bi bi-grid-1x2"></i> 매장 운영 현황</a>
<a class="saas-side-link" data-route="unavailable" href="#" aria-disabled="true" title="매장 설정: 기능 구현 후 연결" onclick="return false;"><i class="bi bi-gear"></i> 내 매장 정보</a>
<div class="saas-nav-section">CUSTOMERS</div>
<a class="saas-side-link" data-route="/customers" href="/customers" th:href="@{/customers}"><i class="bi bi-people"></i> 고객 관리</a>
<div class="saas-nav-section">INSIGHTS</div>
<a class="saas-side-link" data-route="/analytics/dashboard" href="/analytics/dashboard" th:href="@{/analytics/dashboard}"><i class="bi bi-graph-up-arrow"></i> 분석 · RFM · AI</a>


<div class="saas-nav-section">ACCOUNT</div>
<a class="saas-side-link" data-route="/login" href="/login" th:href="@{/login}"><i class="bi bi-box-arrow-in-right"></i> 로그인</a>
<a class="saas-side-link" data-route="/signup" href="/signup" th:href="@{/signup}"><i class="bi bi-person-plus"></i> 회원가입</a>

<div class="saas-sidebar-bottom">Thymeleaf UI Preview<br/>Modern SaaS UI</div>
</aside>
<div aria-hidden="true" class="saas-overlay"></div>
</nav>
<main class="container mb-5">
<div class="row justify-content-center">
<div class="col-md-5">
<div class="card shadow-sm">
<div class="card-body p-4">
<h3 class="card-title text-center mb-4"><i class="bi bi-person-plus"></i> 회원가입</h3>
<div class="alert alert-danger d-none" id="errorMsg"></div>
<div class="alert alert-success d-none" id="successMsg"></div>
<form data-demo-only="true" id="signupForm" onsubmit="return false;">
<div class="mb-3">
<label class="form-label" for="email">이메일</label>
<input class="form-control" id="email" placeholder="example@test.com" required="" type="email"/>
</div>
<div class="mb-3">
<label class="form-label" for="password">비밀번호</label>
<input class="form-control" id="password" maxlength="20" minlength="4" placeholder="4~20자" required="" type="password"/>
</div>
<div class="mb-3">
<label class="form-label" for="nickname">닉네임</label>
<input class="form-control" id="nickname" maxlength="10" minlength="2" placeholder="2~10자" required="" type="text"/>
</div>
<button class="btn btn-primary w-100 mb-3" title="UI preview only — backend implementation pending" type="button"><i class="bi bi-person-plus"></i> 가입하기</button>
</form>
<div class="text-center">
<span class="text-muted">이미 계정이 있으신가요?</span>
<a href="/login" th:href="@{/login}">로그인</a>
</div>
</div>
</div>
</div>
</div>
</main>
<footer class="saas-footer">
<div class="text-center">
<p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
<p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
</div>
</footer>

<script src="/js/modern-saas.js" th:src="@{/js/modern-saas.js}" defer></script>
</body>
</html>
