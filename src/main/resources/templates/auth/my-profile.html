
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
    + 내 매장 정보 조회 화면
    역할: 로그인한 회원이 등록한 매장 목록을 화면에 표시합니다.
          매장이 없는 경우 안내 메시지를 출력하고,
          매장이 있는 경우 매장별 상세 정보를 카드 형태로 제공합니다.
          Thymeleaf를 이용하여 서버에서 전달받은 매장 데이터를 출력합니다.
    작성자: 황현우
    일시: 2026-11-10
-->

<head>
    <!-- 한글 인코딩 및 반응형 화면 설정 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 브라우저 탭 제목 -->
    <title>내 매장 정보 | StoreCRM</title>

    <!-- Bootstrap CSS 라이브러리 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap 아이콘 라이브러리 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- 프로젝트 공통 디자인 CSS -->
    <link rel="stylesheet" th:href="@{/css/modern-saas.css}">
</head>

<body>

<!-- 공통 네비게이션 메뉴 삽입 -->
<nav th:replace="~{fragments/navigation :: navigation}"></nav>

<!--
    + 내 매장 정보 메인 화면
    역할: 등록된 매장 목록과 상세 정보를 표시합니다.
-->
<main class="container py-5">
<!-- 본인 이름만 수정한다. 작성자: 김순민 / 작성일: 2026-11-12 -->
<h1 class="h3">내 정보 수정</h1>
<div class="alert alert-success" th:if="${successMessage != null}" th:text="${successMessage}"></div>
<div class="card p-4">
<p>로그인 이메일: <span th:text="${profile.email}"></span></p>
<form method="post" th:action="@{/my-profile}" th:object="${profileForm}">
<label class="form-label" for="nickname">이름</label>
<input class="form-control" id="nickname" th:field="*{nickname}" maxlength="255" required/>
<div class="text-danger small" th:errors="*{nickname}"></div>
<p class="text-muted mt-2">이메일과 비밀번호는 이 화면에서 변경하지 않습니다.</p>
<button class="btn btn-primary" type="submit">수정 저장</button>
<a class="btn btn-outline-secondary" th:href="@{/}">취소</a>
</form>
</div></main>

<!-- 공통 하단 푸터 영역 -->
<footer class="saas-footer">
    <div class="text-center">
        <p class="mb-1">
            <i class="bi bi-person-hearts"></i>
            단골 고객 관리
        </p>

        <p class="mb-0 text-secondary small">
            © 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI
        </p>
    </div>
</footer>

<!-- 공통 JavaScript 파일 불러오기 -->
<!-- defer : HTML 문서 파싱이 끝난 후 스크립트 실행 -->
<script th:src="@{/js/modern-saas.js}" defer></script>

</body>
</html>
