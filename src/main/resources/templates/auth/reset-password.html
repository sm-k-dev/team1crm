<!DOCTYPE html>
<!--
    + 새 비밀번호 설정 화면
    역할: 이메일로 받은 일회용 토큰을 확인한 뒤
          새 비밀번호 및 확인 비밀번호를 입력받습니다.
          만료되었거나 사용한 링크는 변경 폼을 표시하지 않습니다.
          최종 비밀번호 정책과 토큰 유효성은 서버에서도 검증합니다.
    작성자: 황현우
    일시: 2026-11-16
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="referrer" content="no-referrer"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>새 비밀번호 설정 | StoreCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/modern-saas.css}" href="/css/modern-saas.css"/>
</head>
<body>
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">
                        <i class="bi bi-shield-lock"></i> 새 비밀번호 설정
                    </h3>
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <div th:unless="${valid}" class="alert alert-warning">
                        유효하지 않거나 만료된 링크입니다. 비밀번호 찾기를 다시 진행해 주세요.
                    </div>
                    <!-- 유효한 링크일 때만 표시: 원본 토큰은 숨겨진 필드로 서버에 제출 -->
                    <form th:if="${valid}" th:action="@{/reset-password}" method="post">
                        <input type="hidden" name="token" th:value="${token}"/>
                        <input type="hidden" th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">새 비밀번호</label>
                            <input id="newPassword" name="newPassword" type="password"
                                   class="form-control" minlength="8" maxlength="20"
                                   pattern="(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s])\S{8,20}"
                                   title="영문·숫자·특수문자를 각각 1개 이상 포함한 8~20자, 공백 불가"
                                   autocomplete="new-password" required/>
                            <div class="form-text">영문, 숫자, 특수문자 포함 8~20자 (공백 불가)</div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">새 비밀번호 확인</label>
                            <input id="confirmPassword" name="confirmPassword" type="password"
                                   class="form-control" minlength="8" maxlength="20"
                                   autocomplete="new-password" required/>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">
                            비밀번호 변경하기
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a th:href="@{/forgot-password}" href="/forgot-password">새 링크 요청하기</a>
                        <span class="text-muted mx-2">|</span>
                        <a th:href="@{/login}" href="/login">로그인으로 돌아가기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="saas-footer"><div class="text-center">
    <p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
    <p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
</div></footer>
</body>
</html>
