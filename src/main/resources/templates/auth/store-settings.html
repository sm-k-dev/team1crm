
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>내 매장 정보 | StoreCRM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/modern-saas.css}">
</head>

<body>

<nav th:replace="~{fragments/navigation :: navigation}"></nav>

<!-- 메인 화면 -->
<main class="container py-5 mb-5">

    <div class="saas-home-heading">
        <div>
            <div class="saas-page-eyebrow">WORKSPACE / MY STORE</div>

            <h1 class="saas-page-title">
                내 매장 정보
            </h1>

            <p class="saas-page-subtitle">
                등록된 매장의 정보를 확인하세요.
            </p>
        </div>
    </div>

    <!-- 등록된 매장이 없을 때 -->
    <div th:if="${#lists.isEmpty(stores)}"
         class="alert alert-warning">

        <i class="bi bi-exclamation-circle me-2"></i>

        아직 등록된 매장이 없습니다.

        <a th:href="@{/}" class="alert-link">
            매장 등록하러 가기
        </a>

    </div>

    <!-- 등록된 매장이 있을 때 -->
    <div th:unless="${#lists.isEmpty(stores)}">

        <div class="card border-0 shadow-sm mb-4"
             th:each="store : ${stores}">

            <div class="card-body p-4">

                <h3 class="h4 mb-4">
                    <i class="bi bi-shop text-primary"></i>

                    <span th:text="${store.name}">
                        매장 이름
                    </span>
                </h3>

                <dl class="row">

                    <dt class="col-sm-3">매장 번호</dt>
                    <dd class="col-sm-9"
                        th:text="${store.id}">
                        1
                    </dd>

                    <dt class="col-sm-3">매장명</dt>
                    <dd class="col-sm-9"
                        th:text="${store.name}">
                        매장 이름
                    </dd>

                    <dt class="col-sm-3">업종</dt>
                    <dd class="col-sm-9"
                        th:text="${store.category}">
                        카페
                    </dd>

                    <dt class="col-sm-3">주소</dt>
                    <dd class="col-sm-9"
                        th:text="${store.address}">
                        부산광역시
                    </dd>

                    <dt class="col-sm-3">포인트 적립률</dt>
                    <dd class="col-sm-9"
                        th:text="|${store.pointRate}%|">
                        5%
                    </dd>

                </dl>

            </div>
        </div>

    </div>

    <a th:href="@{/}" class="btn btn-outline-primary">
        <i class="bi bi-arrow-left me-1"></i>
        매장 운영 현황으로 돌아가기
    </a>

</main>

<footer class="saas-footer">
    <div class="text-center">
        <p class="mb-1">
            <i class="bi bi-person-hearts"></i>
            단골 고객 관리
        </p>

        <p class="mb-0 text-secondary small">
            © 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI
        </p>
    </div>
</footer>

<script th:src="@{/js/modern-saas.js}" defer></script>

</body>
</html>
