
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!--
    + 내 매장 정보 조회 화면
    역할: 로그인한 회원이 등록한 매장 목록을 화면에 표시합니다.
          매장이 없는 경우 안내 메시지를 출력하고,
          매장이 있는 경우 매장별 상세 정보를 카드 형태로 제공합니다.
          Thymeleaf를 이용하여 서버에서 전달받은 매장 데이터를 출력합니다.
    작성자: 황현우
    일시: 2026-11-10
-->

<head>
    <!-- 한글 인코딩 및 반응형 화면 설정 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 브라우저 탭 제목 -->
    <title>내 매장 정보 | StoreCRM</title>

    <!-- Bootstrap CSS 라이브러리 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap 아이콘 라이브러리 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- 프로젝트 공통 디자인 CSS -->
    <link rel="stylesheet" th:href="@{/css/modern-saas.css}">
</head>

<body>

<!-- 공통 네비게이션 메뉴 삽입 -->
<nav th:replace="~{fragments/navigation :: navigation}"></nav>

<!--
    + 내 매장 정보 메인 화면
    역할: 등록된 매장 목록과 상세 정보를 표시합니다.
-->
<main class="container py-5 mb-5">

    <!-- 페이지 제목 및 설명 영역 -->
    <div class="saas-home-heading">
        <div>
            <div class="saas-page-eyebrow">WORKSPACE / MY STORE</div>

            <h1 class="saas-page-title">
                내 매장 정보
            </h1>

            <p class="saas-page-subtitle">
                등록된 매장의 정보를 확인하세요.
            </p>
        </div>
    </div>

    <!--
        + 등록된 매장이 없는 경우
        역할: Controller에서 전달한 stores 목록이 비어 있으면
              안내 메시지와 매장 등록 페이지 이동 링크를 표시합니다.
        th:if : 조건이 참일 때 해당 HTML 요소 출력
        #lists.isEmpty() : 목록이 비어 있는지 확인
    -->
    <div th:if="${#lists.isEmpty(stores)}"
         class="alert alert-warning">

        <i class="bi bi-exclamation-circle me-2"></i>

        아직 등록된 매장이 없습니다.

        <!-- 홈 화면으로 이동하는 매장 등록 안내 링크 -->
        <a th:href="@{/}" class="alert-link">
            매장 등록하러 가기
        </a>

    </div>

    <!--
        + 등록된 매장이 있는 경우
        역할: stores 목록에 매장이 존재하면
              각 매장의 정보를 카드 형태로 표시합니다.
        th:unless : 조건이 거짓일 때 해당 HTML 요소 출력
    -->
    <div th:unless="${#lists.isEmpty(stores)}">

        <!--
            매장별 카드 반복 출력
            th:each : stores 목록을 순회하면서
                      매장 하나씩 store 변수에 저장
        -->
        <div class="card border-0 shadow-sm mb-4"
             th:each="store : ${stores}">

            <div class="card-body p-4">

                <!-- 매장 이름 및 아이콘 표시 -->
                <h3 class="h4 mb-4">
                    <i class="bi bi-shop text-primary"></i>

                    <!-- 현재 매장의 이름 출력 -->
                    <span th:text="${store.name}">
                        매장 이름
                    </span>
                </h3>

                <!-- 매장 상세 정보 영역 -->
                <dl class="row">

                    <!-- 매장 고유 번호(PK) -->
                    <dt class="col-sm-3">매장 번호</dt>
                    <dd class="col-sm-9"
                        th:text="${store.id}">
                        1
                    </dd>

                    <!-- 등록된 매장 이름 -->
                    <dt class="col-sm-3">매장명</dt>
                    <dd class="col-sm-9"
                        th:text="${store.name}">
                        매장 이름
                    </dd>

                    <!-- 매장 업종 -->
                    <dt class="col-sm-3">업종</dt>
                    <dd class="col-sm-9"
                        th:text="${store.category}">
                        카페
                    </dd>

                    <!-- 매장 주소 -->
                    <dt class="col-sm-3">주소</dt>
                    <dd class="col-sm-9"
                        th:text="${store.address}">
                        부산광역시
                    </dd>

                    <!--
                        포인트 적립률
                        Thymeleaf 리터럴 치환 문법을 이용하여
                        적립률 숫자 뒤에 % 기호를 붙여 출력
                    -->
                    <dt class="col-sm-3">포인트 적립률</dt>
                    <dd class="col-sm-9"
                        th:text="|${store.pointRate}%|">
                        5%
                    </dd>

                </dl>

            </div>
        </div>

    </div>

    <!-- 홈 화면으로 돌아가기 버튼 -->
    <a th:href="@{/}" class="btn btn-outline-primary">
        <i class="bi bi-arrow-left me-1"></i>
        매장 운영 현황으로 돌아가기
    </a>

</main>

<!-- 공통 하단 푸터 영역 -->
<footer class="saas-footer">
    <div class="text-center">
        <p class="mb-1">
            <i class="bi bi-person-hearts"></i>
            단골 고객 관리
        </p>

        <p class="mb-0 text-secondary small">
            © 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI
        </p>
    </div>
</footer>

<!-- 공통 JavaScript 파일 불러오기 -->
<!-- defer : HTML 문서 파싱이 끝난 후 스크립트 실행 -->
<script th:src="@{/js/modern-saas.js}" defer></script>

</body>
</html>
