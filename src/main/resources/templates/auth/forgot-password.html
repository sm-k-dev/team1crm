<!DOCTYPE html>

<!--
    + 일반 회원 비밀번호 찾기 화면
    역할: 회원가입 시 사용한 이메일을 입력받아
          POST /forgot-password로 재설정 링크 발송을 요청합니다.
          Google 전용 가입 회원은 Google 로그인 이용을 안내합니다.
          계정 존재 여부는 화면에 공개하지 않습니다.
    작성자: 황현우
    일시: 2026-11-16

        수정: 2026-11-20 / 황현우
          비밀번호 재설정 메일 요청을 fetch()로 보내고,
          페이지 새로고침 없이 요청 결과를 표시합니다.
           + 서버 응답을 확인하는 표시_ 42번줄 <div> 에 id="resetServerMessage" 추가
           + 사용자에게 결과를 보여주는 자리_ 43번줄 <div> 에 id="resetStatus" 추가
           + POST요청을 시작하는 폼_ 45번줄 <form> 에 id="resetRequestForm" 추가   45 - 100 - 101 POST 전달 순서
           + <script>_ 비밀번호 재설정 메일을 fetch()로 요청하고, 새로고침 없이 전송 상태와 결과를 표시합니다.
-->

<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>비밀번호 찾기 | StoreCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/modern-saas.css}" href="/css/modern-saas.css"/>
</head>
<body>
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">
                        <i class="bi bi-envelope"></i> 비밀번호 찾기
                    </h3>
                    <p class="text-muted small">일반 회원가입 시 사용한 이메일을 입력해 주세요.
                        Google로 가입한 계정은 Google 로그인으로 이용하시면 됩니다.</p>
                    <div id="resetServerMessage" th:if="${message}" class="alert alert-info" th:text="${message}"></div>
                    <div id="resetStatus" role="status" aria-live="polite"></div>
                    <!-- 이메일 발송 요청: Spring Security CSRF 토큰과 이메일을 함께 POST 전송 -->
                    <form id="resetRequestForm" th:action="@{/forgot-password}" method="post">
                        <input type="hidden" th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label for="email" class="form-label">이메일</label>
                            <input id="email" name="email" type="email" class="form-control"
                                   autocomplete="email" placeholder="example@test.com" maxlength="254" required/>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">
                            <i class="bi bi-send"></i> 재설정 이메일 보내기
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a th:href="@{/login}" href="/login">로그인으로 돌아가기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="saas-footer"><div class="text-center">
    <p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
    <p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
</div></footer>

<script>
    // 2026-11-20 / 황현우 <script> 추가
    // rsetRequestForm기본 폼 제출을 막고 이메일과 CSRF 토큰을 POST /forgot-password로 전송한다.
    // 응답을 기다리는 동안 버튼을 비활성화하고 '전송 중…'을 표시하고, 버튼을 비활성화해 중복 요청을 막습니다.
    // 응답 HTML의 resetServerMessage로 서버가 요청을 처리했는지 확인합니다.
    // resetStatus에 결과를 표시합니다. 정상 처리 시 계정 등록 여부와 관계없이
    // 같은 안내 문구를 보여주고, 요청에 실패하면 오류를 표시합니다.
    // 요청 처리가 끝나면 버튼의 문구와 활성 상태를 복구합니다.

    const resetForm = document.getElementById("resetRequestForm");
    const resetStatus = document.getElementById("resetStatus");

    resetForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const button = resetForm.querySelector('button[type="submit"]');
        if (button.disabled) {
            return;
        }

        const originalLabel = button.innerHTML;
        const body = new URLSearchParams(new FormData(resetForm));

        button.disabled = true;
        button.textContent = "전송 중…";
        resetStatus.className = "";
        resetStatus.textContent = "";
        document.getElementById("resetServerMessage")?.remove();

        try {
            const response = await fetch(resetForm.action, {
                method: "POST",
                credentials: "same-origin",
                body
            });

            if (!response.ok) {
                throw new Error("재설정 요청 실패");
            }

            const page = new DOMParser().parseFromString(
                await response.text(), "text/html"
            );

            if (!page.getElementById("resetServerMessage")) {
                throw new Error("재설정 결과 누락");
            }

            resetStatus.className = "alert alert-info";
            resetStatus.textContent =
                "등록된 이메일이라면 비밀번호 재설정 안내 메일이 발송됩니다.";
        } catch (error) {
            resetStatus.className = "alert alert-danger";
            resetStatus.textContent =
                "요청을 완료하지 못했습니다. 잠시 후 다시 시도해 주세요.";
        } finally {
            button.disabled = false;
            button.innerHTML = originalLabel;
        }
    });
</script>

</body>
</html>
