<!DOCTYPE html>

<!--
    + 일반 회원 비밀번호 찾기 화면
    역할: 회원가입 시 사용한 이메일을 입력받아
          POST /forgot-password로 재설정 링크 발송을 요청합니다.
          Google 전용 가입 회원은 Google 로그인 이용을 안내합니다.
          계정 존재 여부는 화면에 공개하지 않습니다.
    작성자: 황현우
    일시: 2026-11-16
-->

<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>비밀번호 찾기 | StoreCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/modern-saas.css}" href="/css/modern-saas.css"/>
</head>
<body>
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">
                        <i class="bi bi-envelope"></i> 비밀번호 찾기
                    </h3>
                    <p class="text-muted small">일반 회원가입 시 사용한 이메일을 입력해 주세요.
                        Google로 가입한 계정은 Google 로그인으로 이용하시면 됩니다.</p>
                    <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
                    <!-- 이메일 발송 요청: Spring Security CSRF 토큰과 이메일을 함께 POST 전송 -->
                    <form th:action="@{/forgot-password}" method="post">
                        <input type="hidden" th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <div class="mb-3">
                            <label for="email" class="form-label">이메일</label>
                            <input id="email" name="email" type="email" class="form-control"
                                   autocomplete="email" placeholder="example@test.com" maxlength="254" required/>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">
                            <i class="bi bi-send"></i> 재설정 이메일 보내기
                        </button>
                    </form>
                    <div class="text-center mt-3">
                        <a th:href="@{/login}" href="/login">로그인으로 돌아가기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="saas-footer"><div class="text-center">
    <p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
    <p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
</div></footer>
</body>
</html>
