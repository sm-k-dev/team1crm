<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
    + 회원 로그인 화면
    역할: 이메일과 비밀번호를 이용한 일반 로그인 및
          Google OAuth2 소셜 로그인 화면을 제공합니다.
          로그인 실패 및 로그아웃 완료 메시지를 표시하고,
          회원가입 페이지로 이동할 수 있도록 구성합니다.
    작성자: 황현우
    일시: 2026-11-10
-->

<head>
    <!-- 한글 인코딩 및 반응형 화면 설정 -->
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

    <!-- 브라우저 탭 제목 -->
    <title>단골 고객 관리</title>
    <!-- Bootstrap CSS 및 아이콘 라이브러리 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <!-- 프로젝트 공통 디자인 CSS -->
    <link rel="stylesheet" href="/css/modern-saas.css" th:href="@{/css/modern-saas.css}"/>
</head>
<body>
<!-- 공통 네비게이션 메뉴 삽입 -->
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container mb-5">
    <!-- 로그인 화면 메인 영역 -->
    <div class="row justify-content-center">
        <div class="col-md-5">
            <!-- 로그인 카드 영역 -->
            <div class="card shadow-sm">
                <!-- 로그인 화면 제목 -->
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> 로그인</h3>
                    <!--
                        + 로그인 실패 메시지
                        역할: URL에 error 파라미터가 존재하면
                              로그인 실패 안내 메시지를 표시합니다.
                    -->
                    <div th:if="${param.error}" class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i>
                        이메일 또는 비밀번호가 올바르지 않습니다.
                    </div>

                    <!--
                        + 로그아웃 완료 메시지
                        역할: URL에 logout 파라미터가 존재하면
                              로그아웃 성공 안내 메시지를 표시합니다.
                    -->
                    <div th:if="${param.logout}" class="alert alert-success">
                        정상적으로 로그아웃되었습니다.
                    </div>

                    <!--
                        + 일반 로그인 입력 폼
                        역할: 이메일과 비밀번호를 입력받아
                              POST /login 주소로 전송합니다.
                    -->
                    <p class="text-muted small">Google로 가입한 계정은 아래 Google 로그인 버튼을 이용해 주세요.</p>
                    <form id="loginForm" th:action="@{/login}" method="post">

                        <!--
                            CSRF 토큰 전달
                            Spring Security에서 CSRF 토큰을 제공하는 경우
                            숨겨진 입력값으로 서버에 전달합니다.
                         -->
                        <input type="hidden"
                               th:if="${_csrf != null}"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <!-- 이메일 입력 영역 -->
                        <div class="mb-3">
                            <label class="form-label" for="email">이메일</label>
                            <input class="form-control"
                                   id="email"
                                   name="username"
                                   placeholder="example@test.com"
                                   required
                                   type="email"/>
                        </div>
                        <!-- 비밀번호 입력 영역 -->
                        <div class="mb-3">
                            <label class="form-label" for="password">비밀번호</label>
                            <input class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="비밀번호 입력"
                                   required
                                   type="password"/>
                        </div>
                        <!-- 일반 로그인 요청 버튼 -->
                        <button class="btn btn-primary w-100 mb-3" type="submit">
                            <i class="bi bi-box-arrow-in-right"></i>
                            로그인
                        </button>

                    </form>
                    <!--
                    + Google OAuth2 로그인
                    역할: Google 인증 시작 주소로 이동하여
                          Google 계정 로그인을 진행합니다.
                    -->
                    <div class="d-grid gap-2 mb-3">
                        <a class="btn btn-outline-dark" href="/oauth2/authorization/google">
                            <i class="bi bi-google"></i>
                            <span>Google로 로그인</span>
                        </a>
                    </div>
                    <!--
                     + 회원가입 페이지 이동
                     역할: 계정이 없는 사용자를 회원가입 화면으로 이동시킵니다.
                    -->
                    <div class="text-center">
                        <span class="text-muted">계정이 없으신가요?</span>
                        <a href="/signup" th:href="@{/signup}">회원가입</a>
                    </div>
                    <!-- 화면 구분선 -->
                    <hr/>

                </div>
            </div>
        </div>
    </div>
</main>
<!-- 공통 하단 푸터 영역 -->
<footer class="saas-footer">
    <div class="text-center">
        <p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
        <p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
    </div>
</footer>
<!--
    공통 JavaScript 파일
    현재 주석 처리되어 있어 실행되지 않습니다.
-->
<!--<script src="/js/modern-saas.js" th:src="@{/js/modern-saas.js}" defer></script>-->

</body>
</html>
