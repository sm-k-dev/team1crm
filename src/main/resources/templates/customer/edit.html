<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>고객 정보 수정 | StoreCRM</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/modern-saas.css}"/>
</head>
<body>
<nav th:replace="~{fragments/navigation :: navigation}"></nav>

<main class="container mb-5">
    <h2 class="saas-page-title">고객 정보 수정</h2>
    <p class="text-muted" th:text="${selectedStore.name}">매장 이름</p>

    <!--
        고객 수정 입력값을 서버에 제출한다.
        검증 오류가 발생하면 입력값과 오류 메시지를 유지한다.

        작성자: 김순민
        작성일: 2026-11-10
    -->
    <form th:object="${customerForm}"
          th:action="@{/customers/{customerId}/edit(
          customerId=${customerId},
          storeId=${selectedStore.id})}"
          method="post"
          class="card card-body">

        <div class="mb-3">
            <label for="name" class="form-label">이름 *</label>
            <input id="name"
                   th:field="*{name}"
                   class="form-control"
                   maxlength="30"
                   required/>
            <div class="text-danger small" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">전화번호 *</label>
            <input id="phone"
                   th:field="*{phone}"
                   class="form-control"
                   placeholder="010-1234-5678"
                   required/>
            <div class="text-danger small" th:errors="*{phone}"></div>
        </div>

        <div class="mb-3">
            <label for="birthMonth" class="form-label">생일 월</label>
            <select id="birthMonth"
                    th:field="*{birthMonth}"
                    class="form-select">
                <option value="">미입력</option>
                <option th:each="month : ${#numbers.sequence(1, 12)}"
                        th:value="${month}"
                        th:text="|${month}월|"></option>
            </select>
            <div class="text-danger small" th:errors="*{birthMonth}"></div>
        </div>

        <div class="mb-3">
            <label for="memo" class="form-label">메모</label>
            <textarea id="memo"
                      th:field="*{memo}"
                      class="form-control"
                      maxlength="300"
                      rows="3"></textarea>
            <div class="text-danger small" th:errors="*{memo}"></div>
        </div>

        <div class="form-check mb-3">
            <input id="agreeMarketing"
                   th:field="*{agreeMarketing}"
                   class="form-check-input"
                   type="checkbox"/>
            <label for="agreeMarketing" class="form-check-label">
                마케팅 문자 수신 동의
            </label>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">
                저장
            </button>

            <a class="btn btn-outline-secondary"
               th:href="@{/customers/{customerId}(
                   customerId=${customerId},
                   storeId=${selectedStore.id})}">
                취소
            </a>
        </div>
    </form>
</main>

<script th:src="@{/js/modern-saas.js}" defer></script>
</body>
</html>
