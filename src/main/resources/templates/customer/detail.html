<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<title>단골 고객 관리</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

<link rel="stylesheet" href="/css/modern-saas.css" th:href="@{/css/modern-saas.css}"/>
</head>
<body>
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container mb-5">
<div class="card mb-4"><div class="card-body d-flex justify-content-between flex-wrap gap-2">
    <!--
        선택한 매장에 속한 고객의 기본 정보를 표시한다.
        전화번호는 마스킹한 값을 사용한다.

        작성자: 김순민
        작성일: 2026-11-10
    -->
    <div>
        <div class="small text-muted mb-1"
             th:text="${selectedStore.name}">
            매장 이름
        </div>

        <h2 class="mb-1" th:text="${customer.name}">
            고객 이름
        </h2>

        <div class="text-muted" th:text="${customer.maskedPhone}">
            010-****-0000
        </div>

        <div class="small mt-1"
             th:text="${#strings.isEmpty(customer.memo)
             ? '등록된 메모가 없습니다.'
             : customer.memo}">
            메모
        </div>

        <div class="small mt-1"
             th:text="${customer.birthMonth != null
             ? '생일 월: ' + customer.birthMonth + '월'
             : '생일 월: 미입력'}">
            생일 월
        </div>

        <div class="small mt-1"
             th:text="${customer.agreeMarketing
             ? '마케팅 수신: 동의'
             : '마케팅 수신: 미동의'}">
            마케팅 수신 동의 여부
        </div>
    </div>
<div class="d-flex gap-3 text-center">
<div><div class="fs-3 fw-bold text-primary" th:text="${#numbers.formatInteger(visitCount, 1, 'COMMA')}">0</div><div class="small text-muted">방문</div></div>
<!--/* #numbers.formatInteger(값, 최소자리수, 'COMMA') : 1234 → "1,234" */-->
<div><div class="fs-3 fw-bold text-success" th:text="${#numbers.formatInteger(pointBalance, 1, 'COMMA')} + 'P'">0P</div><div class="small text-muted">포인트</div></div>
</div>
</div></div>
<div class="row g-4">
<div class="col-lg-6">
<section th:replace="~{loyalty/_visit :: visitPanel}"></section>
<section th:replace="~{loyalty/_visit :: visitHistory}"></section>
</div>
<div class="col-lg-6">
<section th:replace="~{loyalty/_coupon :: couponPanel}"></section>
<section th:replace="~{loyalty/_point :: pointPanel}"></section>
</div>
</div>
<div class="d-flex gap-2">
    <a class="btn btn-outline-secondary"
       th:href="@{/customers(storeId=${selectedStore.id})}">
        <i class="bi bi-arrow-left"></i> 목록
    </a>
    <a class="btn btn-outline-primary"
       th:href="@{/customers/{customerId}/edit(
       customerId=${customer.id},
       storeId=${selectedStore.id})}">
        <i class="bi bi-pencil"></i> 고객 수정
    </a>
<!-- 고객과 과거 이력은 보존하고 일반 고객 관리에서 제외한다. 작성자: 김순민 / 작성일: 2026-11-11 -->
<form th:action="@{/customers/{customerId}/delete(customerId=${customer.id},storeId=${selectedStore.id})}"
      method="post" class="m-0"
      onsubmit="return confirm('이 고객을 삭제하시겠습니까? 고객 관리 화면에서 제외되며 과거 방문·매출 기록은 유지됩니다.');">
    <button class="btn btn-outline-danger" type="submit"><i class="bi bi-trash"></i> 고객 삭제</button>
</form>
</div>
</main>
<footer class="saas-footer">
<div class="text-center">
<p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
<p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
</div>
</footer>


<script src="/js/modern-saas.js" th:src="@{/js/modern-saas.js}" defer></script>
</body>
</html>
