<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<title>단골 고객 관리</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

<link rel="stylesheet" href="/css/modern-saas.css" th:href="@{/css/modern-saas.css}"/>
</head>
<body>
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container mb-5">
<div class="card mb-4"><div class="card-body d-flex justify-content-between flex-wrap gap-2">
<div>
<h2 class="mb-1">이름</h2>
<div class="text-muted">010-****-0000</div>
<div class="small mt-1">메모</div>
</div>
<div class="d-flex gap-3 text-center">
<div><div class="fs-3 fw-bold text-primary">0</div><div class="small text-muted">방문</div></div>
<!--/* #numbers.formatInteger(값, 최소자리수, 'COMMA') : 1234 → "1,234" */-->
<div><div class="fs-3 fw-bold text-success">0P</div><div class="small text-muted">포인트</div></div>
</div>
</div></div>
<div class="row g-4">
<div class="col-lg-6">
<div class="card mb-4"><div class="card-header fw-bold"><i class="bi bi-receipt"></i> 방문 등록</div><div class="card-body">
<form class="row g-2" data-demo-only="true" id="visitForm" onsubmit="return false;">
<div class="col-6"><input class="form-control" id="vAmount" min="0" placeholder="결제 금액(원)" required="" step="100" type="number"/></div>
<div class="col-6"><input class="form-control" id="vPoint" min="0" placeholder="사용 포인트" type="number" value="0"/></div>
<div class="col-12"><input class="form-control" id="vMemo" maxlength="200" placeholder="메뉴 메모"/></div>
<div class="col-12"><button class="btn btn-primary btn-sm" title="UI preview only — backend implementation pending" type="button">등록 (적립률은 매장 설정)</button></div>
</form>
</div></div>
<div class="card mb-4"><div class="card-header fw-bold">최근 방문</div>
<ul class="list-group list-group-flush">
<li class="list-group-item d-flex justify-content-between">
<span><span>날짜</span> <small class="text-muted">메뉴</small></span>
<span>0원</span>
</li>
<li class="list-group-item text-muted">방문 기록이 없습니다.</li>
</ul>
</div>
</div>
<div class="col-lg-6">
<div class="card mb-4"><div class="card-header fw-bold"><i class="bi bi-ticket-perforated"></i> 쿠폰</div><div class="card-body">
<form class="row g-2 mb-3" data-demo-only="true" id="couponForm" onsubmit="return false;">
<div class="col-12"><input class="form-control" id="cpTitle" maxlength="50" placeholder="쿠폰 이름 (예: 음료 1잔 할인)" required=""/></div>
<div class="col-6"><input class="form-control" id="cpDiscount" min="100" placeholder="할인 금액" required="" step="100" type="number"/></div>
<div class="col-6"><input class="form-control" id="cpExpire" required="" type="date"/></div>
<div class="col-12"><button class="btn btn-outline-primary btn-sm" title="UI preview only — backend implementation pending" type="button">발급</button></div>
</form>
<ul class="list-group">
<!--/* cp.status : Coupon.getStatus() → 사용 가능 / 사용함 / 기한 지남 */-->
<li class="list-group-item d-flex justify-content-between align-items-center">
<span><strong>쿠폰</strong> <small class="text-muted">할인</small></span>
<span>
<span class="badge">상태</span>
<button class="btn btn-sm btn-outline-success ms-1 btn-use">사용</button>
</span>
</li>
<li class="list-group-item text-muted">쿠폰이 없습니다.</li>
</ul>
</div></div>
<div class="card mb-4"><div class="card-header fw-bold">포인트 내역</div>
<ul class="list-group list-group-flush">
<li class="list-group-item d-flex justify-content-between">
<span>날짜</span>
<!--/* p.type.displayName : PointType.getDisplayName() → 적립 / 사용 */-->
<span>적립</span>
</li>
</ul>
</div>
</div>
</div>
<div class="d-flex gap-2">
<a class="btn btn-outline-secondary" href="/customers" th:href="@{/customers}"><i class="bi bi-arrow-left"></i> 목록</a>
<button class="btn btn-outline-danger" onclick="deleteCustomer()" type="button"><i class="bi bi-trash"></i> 고객 삭제</button>
</div>
</main>
<footer class="saas-footer">
<div class="text-center">
<p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
<p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
</div>
</footer>


<script src="/js/modern-saas.js" th:src="@{/js/modern-saas.js}" defer></script>
</body>
</html>
