<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<title>단골 고객 관리</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

<link rel="stylesheet" href="/css/modern-saas.css" th:href="@{/css/modern-saas.css}"/>
</head>
<body>
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container mb-5">
    <!--
        로그인한 회원의 소유 매장 중 고객을 관리할 매장을 선택한다.

        작성자: 김순민
        작성일: 2026-11-10
    -->
    <form th:action="@{/customers}"
          method="get"
          class="d-flex align-items-center gap-2 mb-3">

        <label for="storeId" class="form-label mb-0">
            관리할 매장
        </label>

        <select id="storeId"
                name="storeId"
                class="form-select"
                style="max-width: 280px;">

            <option th:each="store : ${stores}"
                    th:value="${store.id}"
                    th:text="${store.name}"
                    th:selected="${store.id == selectedStore.id}">
                매장 이름
            </option>
        </select>

        <button type="submit" class="btn btn-outline-primary">
            조회
        </button>
    </form>
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
<div><div class="saas-page-eyebrow">CUSTOMERS / DIRECTORY</div><h2 class="saas-page-title mb-0">고객 관리 <small class="text-muted fs-6" th:text="|${customerPage.totalElements}명|">0명</small></h2></div>
<button class="btn btn-primary" data-bs-target="#addBox" data-bs-toggle="collapse" type="button"><i class="bi bi-person-plus"></i> 고객 등록</button>
</div>
<div class="collapse mb-3"
     id="addBox"
     th:classappend="${showRegistration == true} ? 'show' : ''">

    <div class="card card-body">
        <div class="alert alert-danger d-none" id="addMsg"></div>
        <!--
            고객 등록 입력값을 선택한 매장의 등록 처리로 제출한다.
            검증 오류가 발생하면 기존 입력값과 오류 메시지를 표시한다.

            작성자: 김순민
            작성일: 2026-11-09
            변경노트 2026-11-10 김순민: 고객 등록 POST 요청 연결
        -->
    <form class="row g-2"
          id="addForm"
          th:object="${customerForm}"
          th:action="@{/customers(storeId=${selectedStore.id})}"
          method="post">

        <div class="col-md-3">
            <input class="form-control"
                   th:field="*{name}"
                   maxlength="30"
                   placeholder="이름 *"
                   required/>

            <div class="text-danger small"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <div class="col-md-3">
            <input class="form-control"
                   th:field="*{phone}"
                   placeholder="010-1234-5678 *"
                   required/>

            <div class="text-danger small"
                 th:if="${#fields.hasErrors('phone')}"
                 th:errors="*{phone}"></div>
        </div>

        <div class="col-md-2">
            <select class="form-select" th:field="*{birthMonth}">
                <option value="">생일 월</option>
                <option th:each="month : ${#numbers.sequence(1, 12)}"
                        th:value="${month}"
                        th:text="|${month}월|"></option>
            </select>

            <div class="text-danger small"
                 th:if="${#fields.hasErrors('birthMonth')}"
                 th:errors="*{birthMonth}"></div>
        </div>

        <div class="col-md-4">
            <input class="form-control"
                   th:field="*{memo}"
                   maxlength="300"
                   placeholder="메모"/>

            <div class="text-danger small"
                 th:if="${#fields.hasErrors('memo')}"
                 th:errors="*{memo}"></div>
        </div>

        <div class="col-12 form-check ms-2">
            <input class="form-check-input"
                   id="agreeMarketing"
                   type="checkbox"
                   th:field="*{agreeMarketing}"/>

            <label class="form-check-label" for="agreeMarketing">
                마케팅 문자 수신 동의
            </label>
        </div>

        <div class="col-12">
            <button class="btn btn-primary btn-sm" type="submit">
                저장
            </button>
        </div>
    </form>
</div></div>

    <!--
        선택한 매장 안에서 이름 또는 전화번호 뒤 4자리로 고객을 검색한다.
        검색 후에도 검색어와 선택한 매장을 유지한다.

        작성자: 김순민
        작성일: 2026-11-10
    -->
    <form th:action="@{/customers}"
          method="get"
          class="d-flex gap-2 mb-3"
          style="max-width: 560px;">

        <input type="hidden"
               name="storeId"
               th:value="${selectedStore.id}"/>

        <label for="keyword" class="visually-hidden">
            이름 또는 전화번호 뒤 4자리
        </label>

        <input id="keyword"
               class="form-control"
               name="keyword"
               th:value="${keyword}"
               placeholder="이름 또는 전화번호 뒤 4자리"/>

        <button class="btn btn-outline-primary"
                type="submit"
                aria-label="고객 검색">
            <i class="bi bi-search"></i>
        </button>

        <a class="btn btn-outline-secondary text-nowrap"
           th:href="@{/customers(storeId=${selectedStore.id})}">
            초기화
        </a>
    </form>
<div class="table-responsive"><table class="table table-hover align-middle bg-white">
<thead class="table-light"><tr><th>이름</th><th>전화번호</th><th>생일</th><th>수신 동의</th><th>등록일</th></tr></thead>
    <tbody>
        <!--
            매장에 속한 고객 목록을 한 명씩 반복하여 표시한다.
            전화번호는 마스킹하여 표시한다.

            작성자: 김순민
            작성일: 2026-11-06
        -->
        <tr th:each="customer : ${customers}">
            <td>
                <a th:href="@{/customers/{customerId}(
            customerId=${customer.id},
            storeId=${selectedStore.id})}"
                   th:text="${customer.name}">
                    고객 이름
                </a>
            </td>

            <td th:text="${customer.maskedPhone}">
                010-****-0000
            </td>

            <td th:text="${customer.birthMonth != null
                ? customer.birthMonth + '월'
                : '-'}">
                -
            </td>

            <td>
            <span class="badge"
                  th:classappend="${customer.agreeMarketing
                      ? 'bg-success'
                      : 'bg-secondary'}"
                  th:text="${customer.agreeMarketing
                      ? '동의'
                      : '미동의'}">
                수신 동의 여부
            </span>
            </td>

            <td th:text="${#temporals.format(
                customer.createdAt, 'yyyy-MM-dd')}">
                등록일
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(customers)}">
            <td class="text-center text-muted"
                colspan="5"
                th:text="${keyword != null and !#strings.isEmpty(keyword)
                        ? '검색 결과가 없습니다.'
                        : '고객이 없습니다.'}">
                고객이 없습니다.
            </td>
        </tr>
    </tbody>
</table></div>
    <!--
    선택 매장과 검색어를 유지하며 고객 목록 페이지를 이동한다.
    페이지 번호는 서버의 0 기준 값을 화면에서 1부터 표시한다.

    작성자: 김순민
    작성일: 2026-11-10
-->
    <div th:if="${customerPage.totalPages > 0}"
         class="d-flex justify-content-between align-items-center mt-3">

        <div>
            <a th:if="${customerPage.hasPrevious()}"
               class="btn btn-outline-secondary"
               th:href="@{/customers(
               storeId=${selectedStore.id},
               keyword=${keyword},
               page=${customerPage.number - 1})}">
                이전
            </a>

            <span th:unless="${customerPage.hasPrevious()}"
                  class="btn btn-outline-secondary disabled"
                  aria-disabled="true">
            이전
        </span>
        </div>

        <span class="text-muted"
              th:text="|${customerPage.number + 1} / ${customerPage.totalPages} 페이지|">
        1 / 1 페이지
    </span>

        <div>
            <a th:if="${customerPage.hasNext()}"
               class="btn btn-outline-secondary"
               th:href="@{/customers(
               storeId=${selectedStore.id},
               keyword=${keyword},
               page=${customerPage.number + 1})}">
                다음
            </a>

            <span th:unless="${customerPage.hasNext()}"
                  class="btn btn-outline-secondary disabled"
                  aria-disabled="true">
            다음
        </span>
        </div>
    </div>
</main>
<footer class="saas-footer">
<div class="text-center">
<p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
<p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/modern-saas.js"
        th:src="@{/js/modern-saas.js}"
        defer></script>
</body>
</html>
