<!DOCTYPE html>
<!--/*
[error.html] 오류 화면. 404·500 등이 나면 Spring Boot 의 BasicErrorController 객체가 이 화면을 찾아 보여 준다.
  ${status}  : HTTP 상태 코드 (예: 404)
  ${error}   : 상태 이름 (예: Not Found)
  BasicErrorController 가 DefaultErrorAttributes 객체로 만든 값을 Model 에 넣어 전달한다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<title>단골 고객 관리</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

<link rel="stylesheet" href="/css/modern-saas.css" th:href="@{/css/modern-saas.css}"/>
</head>
<body>
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container mb-5 text-center py-5">
<h1 class="display-4">오류</h1>
<p class="lead">요청을 처리하지 못했습니다.</p>
<a class="btn btn-primary" href="/" th:href="@{/}">홈으로</a>
</main>
<footer class="saas-footer">
<div class="text-center">
<p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
<p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
</div>
</footer>
<script src="/js/modern-saas.js" th:src="@{/js/modern-saas.js}" defer></script>
</body>
</html>
