<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

    <title>단골 고객 관리 - 관리자</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

    <link rel="stylesheet" href="/css/modern-saas.css" th:href="@{/css/modern-saas.css}"/>
</head>
<body>
<nav th:replace="~{fragments/navigation :: navigation}"></nav>
<main class="container py-5">
    <div class="card border-0 shadow-sm p-4">
        <h1 class="h3 mb-3">플랫폼 운영 현황</h1>
        <p class="text-secondary">전체 매장과 사장님 계정을 관리합니다.</p>
        <div class="row g-3">
            <div class="col-md-6">
                <div class="alert alert-primary">
                    등록 매장 <strong th:text="${storeCount != null ? storeCount : 0}">0</strong>
                </div>
            </div>
            <div class="col-md-6">
                <div class="alert alert-info">
                    전체 계정 <strong th:text="${ownerCount != null ? ownerCount : 0}">0</strong>
                </div>
            </div>
        </div>
        <a class="btn btn-primary me-2" href="/admin/stores" th:href="@{/admin/stores}">매장 목록</a>
        <a class="btn btn-outline-primary" href="/admin/owners" th:href="@{/admin/owners}">계정 목록</a>
    </div>
</main>
<footer class="saas-footer">
    <div class="text-center">
        <p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
        <p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
    </div>
</footer>
<script src="/js/modern-saas.js" th:src="@{/js/modern-saas.js}" defer></script>
</body>
</html>
