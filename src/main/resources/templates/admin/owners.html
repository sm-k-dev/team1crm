<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>

<title>단골 고객 관리</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

</head><body><nav th:replace="~{fragments/navigation :: navigation}"></nav><main class="container py-4"><h1 class="h3">사장님/매장 관리</h1><p class="text-secondary">사장님 계정 등록 및 매장 연결 현황을 관리합니다.</p><div class="alert alert-info"></div>
<div class="card p-3 mb-3"><h2 class="h5">사장님 계정 등록</h2><form action="#" class="row g-2" data-demo-only="true" method="post" onsubmit="return false;"><div class="col-md-4"><input class="form-control" name="email" placeholder="이메일" required="" type="email"/></div><div class="col-md-3"><input class="form-control" name="nickname" placeholder="이름" required=""/></div><div class="col-md-3"><input class="form-control" minlength="8" name="password" placeholder="초기 비밀번호 (8자 이상)" required="" type="password"/></div><div class="col-md-2"><button class="btn btn-primary">등록</button></div></form></div>
<div class="card p-3"><h2 class="h5">사장님 계정 · 매장 연결</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>ID</th><th>이메일</th><th>이름 수정</th><th>연결된 매장</th><th>관리</th></tr></thead><tbody><tr><td></td><td></td><td><form action="#" data-demo-only="true" method="post" onsubmit="return false;"><input class="form-control form-control-sm" name="nickname" required=""/></form></td><td><span></span><a class="small ms-2" href="/admin/stores" th:href="@{/admin/stores}">매장 연결·변경</a></td><td><button class="btn btn-outline-primary btn-sm">수정</button> <form action="#" class="d-inline" data-demo-only="true" method="post" onsubmit="return false;"><button class="btn btn-outline-danger btn-sm">삭제 요청</button></form></td></tr></tbody></table></div></div>
</main><footer class="saas-footer">
<div class="text-center">
<p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
<p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
</div>
</footer><script src="/js/modern-saas.js" th:src="@{/js/modern-saas.js}" defer></script>
</body></html>
