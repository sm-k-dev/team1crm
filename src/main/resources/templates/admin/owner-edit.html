<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<title>단골 고객 관리</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

<link rel="stylesheet" href="/css/modern-saas.css" th:href="@{/css/modern-saas.css}"/>
</head><body><nav th:replace="~{fragments/navigation :: navigation}"></nav><main class="container py-4">
<h1 class="h3">사장님 이름 수정</h1>
<!-- 이름만 수정하고 인증 정보와 소유 매장 관계는 유지한다. 작성자: 김순민 / 작성일: 2026-11-11 -->
<div class="card p-3">
  <p>계정 이메일: <span th:text="${owner.email}"></span></p>
  <form method="post" th:action="@{/admin/owners/{id}(id=${owner.id})}" th:object="${ownerEditForm}">
    <label for="nickname" class="form-label">이름</label>
    <input id="nickname" class="form-control" th:field="*{nickname}" maxlength="255" required/>
    <div class="text-danger small" th:errors="*{nickname}"></div>
    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-primary" type="submit">수정 저장</button>
      <a class="btn btn-outline-secondary" th:href="@{/admin/owners}">취소</a>
    </div>
  </form>
</div>
</main><footer class="saas-footer">
<div class="text-center">
<p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
<p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
</div>
</footer><script src="/js/modern-saas.js" th:src="@{/js/modern-saas.js}" defer></script>
</body></html>
