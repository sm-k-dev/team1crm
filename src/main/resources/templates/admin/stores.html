<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<title>단골 고객 관리</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>

<link rel="stylesheet" href="/css/modern-saas.css" th:href="@{/css/modern-saas.css}"/>
</head><body><nav th:replace="~{fragments/navigation :: navigation}"></nav><main class="container py-4">
<h1 class="h3">매장 운영 현황</h1><p class="text-secondary">매장과 사장님 계정의 연결을 관리합니다. 매출 정보는 표시하지 않습니다.</p>
<div class="row g-2 mb-3"><div class="col-md-4"><div class="card p-3">전체 매장 <strong>0</strong></div></div><div class="col-md-4"><div class="card p-3">연결된 매장 <strong>0</strong></div></div><div class="col-md-4"><div class="card p-3">사장님 계정 <strong>0</strong></div></div></div>
<div class="alert alert-info"></div>
<div class="card p-3 mb-3"><h2 class="h5">매장 등록</h2><form action="#" class="row g-2" data-demo-only="true" method="post" onsubmit="return false;"><div class="col-md-3"><input class="form-control" maxlength="50" name="name" placeholder="매장명" required=""/></div><div class="col-md-2"><input class="form-control" maxlength="30" name="category" placeholder="업종"/></div><div class="col-md-3"><input class="form-control" maxlength="200" name="address" placeholder="주소"/></div><div class="col-md-3"><select class="form-select" name="ownerId" required=""><option value="">사장님 선택</option><option></option></select></div><div class="col-md-1"><button class="btn btn-primary btn-sm">등록</button></div></form></div>
<div class="card p-3"><h2 class="h5">매장 관리</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>ID</th><th>매장명</th><th>업종</th><th>주소</th><th>연결된 사장님</th><th>관리</th></tr></thead><tbody><tr><td></td><td colspan="4"><form action="#" class="row g-1" data-demo-only="true" method="post" onsubmit="return false;"><div class="col"><input class="form-control form-control-sm" name="name" required=""/></div><div class="col"><input class="form-control form-control-sm" name="category"/></div><div class="col"><input class="form-control form-control-sm" name="address"/></div><div class="col"><select class="form-select form-select-sm" name="ownerId"><option></option></select></div></form></td><td><button class="btn btn-outline-primary btn-sm">수정</button> <form action="#" class="d-inline" data-demo-only="true" method="post" onsubmit="return false;"><button class="btn btn-outline-danger btn-sm" title="보존 정책 확정 전 삭제 비활성">삭제 요청</button></form></td></tr></tbody></table></div></div>
</main><footer class="saas-footer">
<div class="text-center">
<p class="mb-1"><i class="bi bi-person-hearts"></i> 단골 고객 관리</p>
<p class="mb-0 text-secondary small">© 2026 팀 프로젝트 | Spring Boot + JPA + MySQL + Spring AI</p>
</div>
</footer><script src="/js/modern-saas.js" th:src="@{/js/modern-saas.js}" defer></script>
</body></html>
