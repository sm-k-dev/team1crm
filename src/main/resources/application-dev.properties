# Local development: each teammate uses their own MySQL instance.
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# SQL dummy data is opt-in: run docs/sql/seed_dummy.sql manually.
spring.sql.init.mode=never
# Unused AI models disabled for local development
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
