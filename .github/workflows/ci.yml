name: CI

# 모든 PR과 main/develop 브랜치의 push에서 실행합니다.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소합니다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # PR 제목·본문 수정이나 대상 브랜치 변경에도 정책을 다시 확인합니다.
      # PR 입력값은 셸 코드에 직접 넣지 않고 환경변수로 전달합니다.
      - name: main 통합 경로 확인
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" != "develop" || "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]]; then
              echo "::error::main 대상 PR은 같은 저장소의 develop 브랜치에서 생성해야 합니다."
              exit 1
            fi
          fi
          echo "브랜치 통합 경로 검사를 통과했습니다."

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Java 25 준비
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'

      - name: Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v5

      # bash로 실행하면 Windows에서 커밋한 gradlew의 실행 권한에 의존하지 않습니다.
      - name: 빌드 및 테스트
        run: bash ./gradlew clean build --no-daemon
