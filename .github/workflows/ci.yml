name: CI

# 모든 PR과 main/develop 브랜치의 push에서 실행합니다.
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소합니다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Java 25 준비
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '25'

      - name: Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v5

      # bash로 실행하면 Windows에서 커밋한 gradlew의 실행 권한에 의존하지 않습니다.
      - name: 빌드 및 테스트
        run: bash ./gradlew clean build --no-daemon
